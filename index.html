<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Login - Google</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <header>
        <img src="img/search.png" alt="" class="imagem_google">
    </header>

    <script src="script.js"></script>

    <main>
        <div class="container">
            <h1>Login</h1>
            <br>
            <label for="">Usuário</label>
            <br>
            <input type="text" name="" class="input_usuario" placeholder="Digite seu usuário" id="input_usuario">
            <br>
            <label for="">Senha</label>
            <br>
            <input type="password" name="" class="input_senha" placeholder="Digite sua senha" id="input_senha">
            <br><br>
            <button onclick="logar">Entrar</button>
        </div>
    </main>

    <footer>
        <p>Entre em contato com o suporte</p>
        <img src="img/whatsapp.png" class="img_zap">
    </footer>
</body>
</html>
